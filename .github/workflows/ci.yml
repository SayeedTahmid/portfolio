# Runs the same checks as `npm run check` plus the Playwright suite on every push to
# main and every pull request. Vercel builds deployments separately; this catches
# content, accessibility and layout regressions before they reach production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck, lint, formatting, contrast, content validation, production build
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - run: npx playwright install --with-deps chromium

      # Runs against the production build from the previous step
      - run: npx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
